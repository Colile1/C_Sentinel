# pytest.ini - test discovery and marker registration for Sentinel-IR.
# Author: Colile

[pytest]
testpaths = libs services tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: requires the Docker Compose stack to be running
# Every service names its test package `tests`, so the default `prepend`
# import mode makes the second one collide with the first. `--import-mode=
# importlib` resolves each module by its path instead, which is what lets all
# three services keep the same folder layout.
addopts = -q --strict-markers --import-mode=importlib
