# gateway/kong.yml - the declarative Kong configuration. The single source of
# gateway truth, loaded DB-less at container start from a read-only mount.
#
# Kong is the only public entry point: `http://localhost:8000`. The service
# ports 8001-8003 are published for inspection and are not the public API.
#
# Reading order, because Kong's model is not obvious: a `service` is an
# upstream, a `route` is a way of reaching it, and a `plugin` attached to a
# route applies only to that route. auth-service therefore appears as TWO
# routes on ONE service - `auth-public` carries no jwt plugin so that login can
# be reached without a token, `auth-protected` carries it so everything else
# under /api/v1/auth cannot. That split is the whole reason this file is not
# three services and three routes.
#
# What the marker is shown (gateway/README.md, build step 10):
#   - every endpoint in docs/api.md answers on :8000;
#   - no token to a protected route -> 401 raised HERE, upstream log silent;
#   - over the rate limit -> 429;
#   - X-Correlation-ID on the response of every request.
#
# Secrets: the signing key is NOT written here. `__JWT_SECRET__` below is a
# placeholder that deploy/kong-entrypoint.sh replaces with $KONG_JWT_SECRET into
# a temporary copy of this file before Kong starts, so the checked-in config
# holds no key and the mount stays read-only.
#
# Two forms that look like they would do this do NOT work, and both fail
# silently - Kong starts clean and then rejects every valid token with
# "Invalid signature", which is the worst way to discover it:
#   - `${{ env "..." }}` is decK's templating, not Kong's; DB-less Kong stores
#     the literal string as the secret.
#   - `{vault://env/kong-jwt-secret}` is a real Kong vault reference and
#     resolves correctly under `kong vault get`, but `jwt_secrets.secret` is not
#     a referenceable field in Kong 3.7, so the plugin still compares against the
#     raw reference string.
# Verified against kong:3.7 at build step 10 before this file was committed.
#
# Author: Colile

_format_version: "3.0"
_transform: true

# --- upstream services ------------------------------------------------------
# `host` is the Compose service name, which is also the address the service
# advertises to Consul, so the gateway and the registry agree on one spelling.
# Paths are NOT rewritten: the services already mount their routers under
# /api/v1/..., so what the client asks for is what the upstream receives.

services:

  - name: auth-service
    host: auth-service
    port: 8001
    protocol: http
    retries: 3
    connect_timeout: 3000
    write_timeout: 10000
    read_timeout: 10000
    routes:

      # Public. Login is the one endpoint that cannot require a token - it is
      # what issues them. Declared BEFORE the protected route and with a longer,
      # exact path so Kong's most-specific-prefix match picks it first.
      - name: auth-login
        paths:
          - /api/v1/auth/login
        strip_path: false
        methods:
          - POST

      # Everything else under /api/v1/auth: verify, and the admin user routes.
      # Protected by the jwt plugin attached below.
      - name: auth-protected
        paths:
          - /api/v1/auth
        strip_path: false

  - name: incident-service
    host: incident-service
    port: 8002
    protocol: http
    retries: 3
    connect_timeout: 3000
    write_timeout: 10000
    # 20s, not the 10s the other upstreams use. incident-service is the only
    # service that calls a dependency behind the retry + circuit breaker
    # (asset-service, D-16). When that dependency is down, the first create
    # still spends RETRY_MAX_ATTEMPTS (3) x DEPENDENCY_TIMEOUT_SECONDS (3.0)
    # plus backoff - about 9.4s - before the breaker opens and returns the
    # documented degraded 201. At 10s Kong gave up first and sent a 504, which
    # hid the graceful degradation the pattern exists to demonstrate.
    read_timeout: 20000
    routes:
      - name: incidents
        paths:
          - /api/v1/incidents
        strip_path: false

  - name: asset-service
    host: asset-service
    port: 8003
    protocol: http
    retries: 3
    connect_timeout: 3000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: assets
        paths:
          - /api/v1/assets
        strip_path: false

# --- consumers --------------------------------------------------------------
# Kong's jwt plugin does not accept a global shared secret: it reads the token's
# `iss` claim, finds the jwt_secrets entry whose `key` equals it, and verifies
# the signature with that entry's secret (D-10). So there is exactly one
# consumer, and its credential key is the issuer string that
# services/auth-service/app/services/token_service.py exports as TOKEN_ISSUER.
# Those two strings must never be edited apart.
#
# The rate limit is attached to this consumer rather than globally, so it counts
# authenticated callers, which is the abnormal-request-rate signal Phase 2's
# Rule 3 reads.

consumers:
  - username: sentinel-ir-client
    jwt_secrets:
      - key: sentinel-ir-auth
        algorithm: HS256
        secret: __JWT_SECRET__

# --- plugins ----------------------------------------------------------------

plugins:

  # Correlation ID, global: stamps X-Correlation-ID on every request that does
  # not already carry one and echoes it on the response. `echo_downstream` is
  # what makes the header visible to the client, which is how the demo proves
  # one workflow threads three services' logs. The services' own middleware
  # honours an inbound header and only mints an id when there is none, so the
  # gateway's value wins end to end (libs/common/middleware.py).
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid#counter
      echo_downstream: true

  # JWT validation at the edge, on the protected routes only. A request without
  # a valid token is refused with 401 here and never reaches a domain service -
  # the upstream log staying silent is the evidence the gateway is doing work.
  # `claims_to_verify: exp` makes Kong reject an expired token rather than
  # leaving expiry to the service.
  - name: jwt
    route: auth-protected
    config:
      claims_to_verify:
        - exp
      key_claim_name: iss
      secret_is_base64: false

  - name: jwt
    route: incidents
    config:
      claims_to_verify:
        - exp
      key_claim_name: iss
      secret_is_base64: false

  - name: jwt
    route: assets
    config:
      claims_to_verify:
        - exp
      key_claim_name: iss
      secret_is_base64: false

  # Prometheus metrics, global. Kong then serves an exposition page on its Admin
  # API listener at :8081/metrics - per-route request counts, status codes and
  # upstream latency - which observability/prometheus/prometheus.yml scrapes as
  # the `kong` job. Adds gateway-side visibility to the three services' own
  # /metrics; nothing depends on it.
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: false
      upstream_health_metrics: false

  # Rate limiting, global so it also covers the unauthenticated login route -
  # which is where a brute-force attempt actually lands, and what Phase 2's
  # Rule 3 needs to see. Counters live in the Kong node's memory, which is what
  # DB-less mode supports and is sufficient for a single-node demo stack.
  # 60/minute is deliberately low enough to trip on camera with a short loop.
  - name: rate-limiting
    config:
      minute: 60
      hour: 1000
      policy: local
      limit_by: consumer
      fault_tolerant: true
      hide_client_headers: false

  # Gateway security events, global. This is what puts `api-gateway` into the
  # collector's live stream instead of only into a hand-written fixture.
  #
  # The problem this solves: Kong's ordinary access log is nginx combined
  # format - `IP - - [date] "GET /path" 401 26 "-" "curl"` - which carries no
  # eventType, no correlationId and no severity, so soc/collector/reader.py
  # skips every line of it as an application log line. The gateway was
  # therefore the one emitter in docs/soc-events.md that the collector could
  # never see live; UNAUTHORISED_ACCESS and RATE_LIMIT_EXCEEDED reached the
  # rules only through `--file`.
  #
  # file-log writes to /dev/stdout, so the events land in `docker compose logs`
  # beside the three services' own events and the existing collector source
  # picks them up with no reader change - the source addition the step-14 note
  # asked for.
  #
  # `custom_fields_by_lua` runs one sandboxed expression per key. Two things
  # about it are not obvious and both were verified against kong:3.7 here:
  #   - returning nil UNSETS a field, which is the only way to drop Kong's
  #     default payload (latencies, request, response, route, service, source,
  #     ...). The pruned list mirrors the `root` table in kong/pdk/log.lua.
  #     libs/common/events.py sets extra="forbid", so a single leftover key
  #     makes the reader raise MalformedEventError on every gateway line.
  #   - the sandbox exposes `kong`, `ngx`, and the safe stdlib (string, math,
  #     os), which is enough to mint the id and stamp the timestamp.
  # `_prune` is keyed first only for readability; key order is not load-bearing,
  # since every expression runs before kong.log.serialize() is called.
  #
  # Only refusals are emitted. A 200 through the gateway is already covered by
  # the upstream service's own REQUEST_RECEIVED/REQUEST_COMPLETED pair, and
  # emitting it here too would double-count Rule 3's volume signal.
  - name: file-log
    config:
      path: /dev/stdout
      reopen: false
      custom_fields_by_lua:

        # Drop Kong's own serialized payload. `correlation_id` is in this list
        # because the global correlation-id plugin injects it into the
        # serializer as snake_case - it is NOT one of the default fields in
        # kong/pdk/log.lua, and missing it made every real gateway event fail
        # the reader on `non-schema keys ['correlation_id']`. Any future plugin
        # that adds a serializer field must be pruned here too.
        #
        # A permitted request returns nil from every expression below, so it
        # serializes to `{}` - no eventType, which is exactly what the reader
        # skips, and no partially-filled stub line.
        _prune: |
          for _, k in ipairs({"latencies","request","response","route","service",
                              "client_ip","started_at","upstream_uri","workspace",
                              "workspace_name","consumer","authenticated_entity",
                              "tries","upstream_status","source","correlation_id"}) do
            kong.log.set_serialize_value(k, nil)
          end
          return nil

        eventId: |
          local s = kong.response.get_status()
          if not (s == 401 or s == 403 or s == 429) then return nil end
          return "evt-" .. string.format("%06x", math.random(0, 16777215))
                        .. string.format("%06x", math.random(0, 16777215))

        timestamp: |
          local s = kong.response.get_status()
          if not (s == 401 or s == 403 or s == 429) then return nil end
          return os.date("!%Y-%m-%dT%H:%M:%SZ")

        serviceName: |
          local s = kong.response.get_status()
          if s == 401 or s == 403 or s == 429 then return "api-gateway" end
          return nil

        eventType: |
          local s = kong.response.get_status()
          if s == 429 then return "RATE_LIMIT_EXCEEDED" end
          if s == 401 or s == 403 then return "UNAUTHORISED_ACCESS" end
          return nil

        # A refused request is MEDIUM: on its own it is one bounced caller, and
        # it is the rules that decide when a run of them is serious. Matches the
        # severities the step-15 fixture uses for the same two event types.
        severity: |
          local s = kong.response.get_status()
          if s == 401 or s == 403 or s == 429 then return "MEDIUM" end
          return nil

        endpoint: |
          local s = kong.response.get_status()
          if s == 401 or s == 403 or s == 429 then
            return kong.request.get_path()
          end
          return nil

        httpMethod: |
          local s = kong.response.get_status()
          if s == 401 or s == 403 or s == 429 then
            return kong.request.get_method()
          end
          return nil

        statusCode: |
          local s = kong.response.get_status()
          if s == 401 or s == 403 or s == 429 then return s end
          return nil

        message: |
          local s = kong.response.get_status()
          if s == 429 then return "Request refused: rate limit exceeded." end
          if s == 401 or s == 403 then
            return "Request to " .. kong.request.get_path()
                   .. " refused: caller is not authorised."
          end
          return nil

        # The gateway's own correlation-id plugin has already stamped the
        # header by the log phase, so the gateway event threads onto the same
        # workflow as the services' events. The fallback only covers a request
        # refused before that plugin ran.
        correlationId: |
          local s = kong.response.get_status()
          if not (s == 401 or s == 403 or s == 429) then return nil end
          return kong.request.get_header("X-Correlation-ID")
                 or ("corr-gateway-" .. string.format("%08x", math.random(0, 2^31)))

        # userId is the authenticated consumer where there is one. On a 401
        # there is by definition no verified identity, so the field stays absent
        # rather than being filled with an unverified claim.
        userId: |
          local c = kong.client.get_consumer()
          if c then return c.username end
          return nil

        sourceIp: |
          local s = kong.response.get_status()
          if s == 401 or s == 403 or s == 429 then
            return kong.client.get_forwarded_ip()
          end
          return nil

        affectedEntity: |
          local s = kong.response.get_status()
          if s == 429 then return "rate-limit" end
          if s == 401 or s == 403 then return kong.request.get_path() end
          return nil
