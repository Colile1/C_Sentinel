# pyproject.toml - packaging for the shared libs/ package.
# Author: Colile
#
# Only libs/ is installable. The services are applications, not packages;
# each container copies libs/ in and installs it (see libs/README.md).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-common"
version = "0.1.0"
description = "Shared infrastructure for the Sentinel-IR microservices"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "libs"}

[tool.setuptools.packages.find]
where = ["libs"]
include = ["common*"]
