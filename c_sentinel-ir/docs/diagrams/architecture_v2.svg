<rect x="120.0" y="466.0" width="536.32" height="70.0" rx="4" fill="#F7F9FB" stroke="#B7C0CC" stroke-width="1" stroke-dasharray="5 3"/>
<text x="134.0" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="600" fill="#1F2933">PATTERN 1: Database per Service</text>
<text x="134.0" y="502.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4A5568">Three separate PostgreSQL containers; each service holds exactly one DATABASE_URL</text>
<text x="134.0" y="516.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4A5568">No service reads another&#x27;s tables; incident-service stores an asset id and a name snapshot, never a foreign key into asset-db</text>
<rect x="120.0" y="558.0" width="536.32" height="70.0" rx="4" fill="#F7F9FB" stroke="#B7C0CC" stroke-width="1" stroke-dasharray="5 3"/>
<text x="134.0" y="578.0" font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="600" fill="#1F2933">PATTERN 2: Circuit Breaker with Retry</text>
<text x="134.0" y="594.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4A5568">incident-service calls asset-service only through libs/common/http_client.py</text>
<text x="134.0" y="608.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4A5568">tenacity retry nested inside a pybreaker circuit breaker; fallback keeps incident creation working while the dependency is down</text>
<rect x="120.0" y="650.0" width="536.32" height="84.0" rx="4" fill="#F7F9FB" stroke="#B7C0CC" stroke-width="1" stroke-dasharray="5 3"/>
<text x="134.0" y="670.0" font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="600" fill="#1F2933">Observability and security-event collection</text>
<text x="134.0" y="686.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4A5568">Prometheus scrapes /metrics on every service; Grafana dashboards</text>
<text x="134.0" y="700.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4A5568">Every service emits one-line JSON security events on a fixed schema</text>
<text x="134.0" y="714.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4A5568">X-Correlation-ID minted at the gateway, carried through every service</text>
<rect x="120.0" y="756.0" width="536.32" height="112.0" rx="4" fill="#F7F9FB" stroke="#B7C0CC" stroke-width="1" stroke-dasharray="5 3"/>
