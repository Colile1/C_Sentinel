<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="bold">Sentinel-IR — Deliverable 1 architecture</text>

  <!-- Client -->
  <rect x="500" y="55" width="200" height="50" rx="6" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.5"/>
  <text x="600" y="85" text-anchor="middle">Client (demo_workflow.py)</text>

  <!-- Gateway -->
  <rect x="470" y="140" width="260" height="60" rx="6" fill="#fef3e0" stroke="#e69138" stroke-width="1.5"/>
  <text x="600" y="165" text-anchor="middle" font-weight="bold">Kong API Gateway :8000</text>
  <text x="600" y="184" text-anchor="middle" font-size="12">JWT · rate limit · correlation-ID</text>
  <line x1="600" y1="105" x2="600" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Services -->
  <rect x="90"  y="250" width="220" height="60" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="200" y="275" text-anchor="middle" font-weight="bold">auth-service :8001</text>
  <text x="200" y="294" text-anchor="middle" font-size="12">login, JWT issue/verify</text>

  <rect x="490" y="250" width="220" height="60" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="600" y="275" text-anchor="middle" font-weight="bold">incident-service :8002</text>
  <text x="600" y="294" text-anchor="middle" font-size="12">incident CRUD, severity</text>

  <rect x="890" y="250" width="220" height="60" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="1000" y="275" text-anchor="middle" font-weight="bold">asset-service :8003</text>
  <text x="1000" y="294" text-anchor="middle" font-size="12">asset register CRUD</text>

  <line x1="530" y1="200" x2="220" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="200" x2="600" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="200" x2="980" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- incident -> asset via retry/breaker -->
  <line x1="710" y1="280" x2="890" y2="280" stroke="#a61c00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="270" text-anchor="middle" font-size="11" fill="#a61c00">retry + circuit breaker</text>
  <text x="800" y="243" text-anchor="middle" font-size="10" fill="#a61c00">(libs/common/http_client.py)</text>

  <!-- Databases -->
  <rect x="110" y="360" width="180" height="50" rx="25" fill="#f3e8fd" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="200" y="390" text-anchor="middle">auth-db (Postgres)</text>
  <rect x="510" y="360" width="180" height="50" rx="25" fill="#f3e8fd" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="600" y="390" text-anchor="middle">incident-db (Postgres)</text>
  <rect x="910" y="360" width="180" height="50" rx="25" fill="#f3e8fd" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="1000" y="390" text-anchor="middle">asset-db (Postgres)</text>

  <line x1="200" y1="310" x2="200" y2="360" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="310" x2="600" y2="360" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="310" x2="1000" y2="360" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="345" text-anchor="middle" font-size="10">own DB only</text>
  <text x="600" y="345" text-anchor="middle" font-size="10">own DB only</text>
  <text x="1000" y="345" text-anchor="middle" font-size="10">own DB only</text>

  <!-- Consul -->
  <rect x="40" y="140" width="180" height="60" rx="6" fill="#fce8e6" stroke="#c5221f" stroke-width="1.5"/>
  <text x="130" y="165" text-anchor="middle" font-weight="bold">Consul :8500</text>
  <text x="130" y="184" text-anchor="middle" font-size="12">registry / health</text>
  <line x1="130" y1="200" x2="190" y2="250" stroke="#333" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="130" y1="200" x2="590" y2="252" stroke="#333" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="220" y1="165" x2="470" y2="165" stroke="#333" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="345" y="158" text-anchor="middle" font-size="10">resolves instances</text>

  <!-- Observability -->
  <rect x="960" y="140" width="200" height="60" rx="6" fill="#e8eaed" stroke="#5f6368" stroke-width="1.5"/>
  <text x="1060" y="165" text-anchor="middle" font-weight="bold">Prometheus :9090</text>
  <text x="1060" y="184" text-anchor="middle" font-size="12">→ Grafana :3000</text>

  <!-- Logging pipeline -->
  <rect x="150" y="460" width="900" height="60" rx="6" fill="#fff3cd" stroke="#b38600" stroke-width="1.5"/>
  <text x="600" y="485" text-anchor="middle" font-weight="bold">Docker stdout logs — JSON structured security events</text>
  <text x="600" y="504" text-anchor="middle" font-size="12">libs/common/events.py + logging.py — every event carries correlationId, feeds docs/soc-events.md</text>

  <line x1="200" y1="410" x2="250" y2="460" stroke="#b38600" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="600" y1="310" x2="600" y2="460" stroke="#b38600" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="1000" y1="410" x2="950" y2="460" stroke="#b38600" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="600" y1="200" x2="600" y2="460" stroke="#b38600" stroke-width="1" stroke-dasharray="2 6" marker-end="url(#arrow)"/>

  <!-- Docker boundary -->
  <rect x="30" y="230" width="1140" height="200" rx="10" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="225" font-size="12" fill="#666">docker compose — one container per service and per database</text>

  <!-- Legend -->
  <text x="60" y="560" font-size="12" font-weight="bold">Legend</text>
  <line x1="60" y1="575" x2="100" y2="575" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="110" y="580" font-size="12">HTTP request (gateway-mediated)</text>
  <line x1="60" y1="598" x2="100" y2="598" stroke="#a61c00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="110" y="603" font-size="12">Cross-service call via retry + circuit breaker (pattern 2)</text>
  <line x1="60" y1="621" x2="100" y2="621" stroke="#333" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="110" y="626" font-size="12">Registration / discovery / metrics scrape</text>
  <line x1="60" y1="644" x2="100" y2="644" stroke="#b38600" stroke-width="1" stroke-dasharray="2 6" marker-end="url(#arrow)"/>
  <text x="110" y="649" font-size="12">Structured JSON security event, stdout to log pipeline</text>

  <text x="60" y="685" font-size="12" font-weight="bold">Pattern 1 — Database per Service</text>
  <text x="60" y="704" font-size="12">Three isolated Postgres containers; incident-service stores an asset_id and a name snapshot, never a foreign key.</text>
  <text x="60" y="727" font-size="12" font-weight="bold">Pattern 2 — Circuit Breaker with Retry</text>
  <text x="60" y="746" font-size="12">incident → asset calls go only through libs/common/http_client.py: retry-with-backoff inside a breaker with a documented fallback.</text>

  <text x="1050" y="746" font-size="11" fill="#666" text-anchor="end">Colile Sibanda — 56543115 — ITRI623</text>
</svg>
