# deploy/docker-compose.yml - the whole Sentinel-IR stack in one file.
#
# `docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d`
# from the repository root brings up: the Kong gateway, Consul, three PostgreSQL
# containers (one per service, D-04), and the three FastAPI services, each its
# own image built from deploy/Dockerfile.service with the repository root as
# build context.
#
# Kong is the only public entry point, on localhost:8000. Prometheus (9090) and
# Grafana (3001) scrape and chart the /metrics endpoints; neither is on the
# request path and nothing in the services depends on them.
#
# Every service:
#   - is built from the SAME Dockerfile, selected by the SERVICE_NAME build arg
#     (one file, not three - deploy/README.md);
#   - gets exactly ONE database URL, its own (D-04);
#   - advertises itself to Consul under its Compose service name, which is the
#     address other containers and Consul's health check resolve;
#   - publishes its inspection port (8001-8003) to localhost for the demo.
#
# Author: Colile

name: sentinel-ir

x-service-env: &service-common-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CONSUL_HOST: ${CONSUL_HOST:-consul}
  CONSUL_PORT: ${CONSUL_PORT:-8500}
  CONSUL_ENABLED: ${CONSUL_ENABLED:-true}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}

x-db-healthcheck: &db-healthcheck
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 10s

services:

  # --- service registry -----------------------------------------------------
  consul:
    image: hashicorp/consul:1.19
    container_name: sentinel-consul
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --- API gateway: the single public entry point ---------------------------
  # DB-less: the whole configuration is gateway/kong.yml, mounted read-only, so
  # a routing change needs a `docker compose restart kong` and never a rebuild.
  #
  # KONG_JWT_SECRET carries the same signing key the services get as JWT_SECRET.
  # kong-entrypoint.sh substitutes it into a rendered copy of kong.yml at start,
  # because Kong 3.7 has no working way to pull a secret into a jwt_secrets
  # credential in DB-less mode - see the comment at the top of that script and
  # of gateway/kong.yml. That is why KONG_DECLARATIVE_CONFIG is not set here:
  # the entrypoint sets it to the rendered path.
  #
  # The admin API is on 8081, not Kong's default 8001, because auth-service owns
  # 8001 for direct inspection (deploy/README.md), and is bound to 127.0.0.1.
  kong:
    image: kong:3.7
    container_name: sentinel-kong
    entrypoint: ["/usr/local/bin/kong-entrypoint.sh"]
    command: ["kong", "docker-start"]
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8081
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-notice}
      KONG_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
    volumes:
      - ../gateway/kong.yml:/etc/kong/kong.yml:ro
      - ./kong-entrypoint.sh:/usr/local/bin/kong-entrypoint.sh:ro
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8081:8081"
    depends_on:
      auth-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy
      asset-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # --- databases: one container per service (D-04) -----------------------
  auth-db:
    image: postgres:16
    container_name: sentinel-auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-auth_service}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in deploy/.env}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./postgres/init/auth-db.sql:/docker-entrypoint-initdb.d/10-auth-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth_service} -d ${AUTH_DB_NAME:-auth_db}"]
      <<: *db-healthcheck

  incident-db:
    image: postgres:16
    container_name: sentinel-incident-db
    environment:
      POSTGRES_DB: ${INCIDENT_DB_NAME:-incident_db}
      POSTGRES_USER: ${INCIDENT_DB_USER:-incident_service}
      POSTGRES_PASSWORD: ${INCIDENT_DB_PASSWORD:?set INCIDENT_DB_PASSWORD in deploy/.env}
    volumes:
      - incident-db-data:/var/lib/postgresql/data
      - ./postgres/init/incident-db.sql:/docker-entrypoint-initdb.d/10-incident-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INCIDENT_DB_USER:-incident_service} -d ${INCIDENT_DB_NAME:-incident_db}"]
      <<: *db-healthcheck

  asset-db:
    image: postgres:16
    container_name: sentinel-asset-db
    environment:
      POSTGRES_DB: ${ASSET_DB_NAME:-asset_db}
      POSTGRES_USER: ${ASSET_DB_USER:-asset_service}
      POSTGRES_PASSWORD: ${ASSET_DB_PASSWORD:?set ASSET_DB_PASSWORD in deploy/.env}
    volumes:
      - asset-db-data:/var/lib/postgresql/data
      - ./postgres/init/asset-db.sql:/docker-entrypoint-initdb.d/10-asset-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ASSET_DB_USER:-asset_service} -d ${ASSET_DB_NAME:-asset_db}"]
      <<: *db-healthcheck

  # --- domain services --------------------------------------------------
  auth-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE_NAME: auth-service
    image: sentinel-ir/auth-service:0.1.0
    container_name: sentinel-auth-service
    environment:
      <<: *service-common-env
      SERVICE_NAME: auth-service
      SERVICE_PORT: "8001"
      ADVERTISE_HOST: auth-service
      # Assembled from the DB parts so a password literal lives in exactly one
      # variable (AUTH_DB_PASSWORD), never in a checked-in connection string.
      DATABASE_URL: postgresql+psycopg://${AUTH_DB_USER:-auth_service}:${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in deploy/.env}@auth-db:5432/${AUTH_DB_NAME:-auth_db}
      # The one admin auth-service seeds at startup so scripts/seed_data.py has
      # an account to log in as and create every other user through the API
      # (D-23). Only auth-service reads these.
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      auth-db:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health/live').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  incident-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE_NAME: incident-service
    image: sentinel-ir/incident-service:0.1.0
    container_name: sentinel-incident-service
    environment:
      <<: *service-common-env
      SERVICE_NAME: incident-service
      SERVICE_PORT: "8002"
      ADVERTISE_HOST: incident-service
      DATABASE_URL: postgresql+psycopg://${INCIDENT_DB_USER:-incident_service}:${INCIDENT_DB_PASSWORD:?set INCIDENT_DB_PASSWORD in deploy/.env}@incident-db:5432/${INCIDENT_DB_NAME:-incident_db}
      ASSET_SERVICE_URL: ${ASSET_SERVICE_URL:-http://asset-service:8003}
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-3.0}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-0.2}
      CIRCUIT_FAIL_MAX: ${CIRCUIT_FAIL_MAX:-3}
      CIRCUIT_RESET_SECONDS: ${CIRCUIT_RESET_SECONDS:-15.0}
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      incident-db:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health/live').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  asset-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE_NAME: asset-service
    image: sentinel-ir/asset-service:0.1.0
    container_name: sentinel-asset-service
    environment:
      <<: *service-common-env
      SERVICE_NAME: asset-service
      SERVICE_PORT: "8003"
      ADVERTISE_HOST: asset-service
      DATABASE_URL: postgresql+psycopg://${ASSET_DB_USER:-asset_service}:${ASSET_DB_PASSWORD:?set ASSET_DB_PASSWORD in deploy/.env}@asset-db:5432/${ASSET_DB_NAME:-asset_db}
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      asset-db:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health/live').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # --- observability: metrics scrape and dashboards (step 11) --------------
  # Prometheus scrapes /metrics on the three services and the Kong admin
  # listener; Grafana reads Prometheus only. Both bound to 127.0.0.1. Neither
  # is a dependency of any service - the stack is healthy without them.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: sentinel-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  grafana:
    image: grafana/grafana:11.1.0
    container_name: sentinel-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      # Anonymous viewer so the demo opens straight onto the dashboard; the
      # admin login still exists for any change.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sentinel.json
      # Grafana still listens on 3000 inside the container; only the published
      # host port moves - 3000 is a common dev-server port and is often taken.
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ../observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ../observability/grafana/dashboards/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/dashboard-provider.yml:ro
      - ../observability/grafana/dashboards/sentinel.json:/var/lib/grafana/dashboards/sentinel.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3901:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # --- Phase 2: the knowledge graph ------------------------------------------
  # Neo4j holds the security knowledge graph (kg/). It is not on the request
  # path - kg/loader/main.py populates it offline from the collected event
  # stream, and kg/cypher/graph_service.py reads it - so no Phase 1 service
  # depends on it and it has no Consul registration.
  neo4j:
    image: neo4j:5.22
    container_name: sentinel-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in deploy/.env}
      # Keep the demo password short-friendly; raise for anything real.
      NEO4J_dbms_security_auth__minimum__password__length: "8"
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j-data:/data
    ports:
      - "127.0.0.1:7474:7474"   # HTTP browser
      - "127.0.0.1:7687:7687"   # Bolt driver
    healthcheck:
      # cypher-shell's JVM start-up alone can exceed a short timeout on a loaded
      # host, so probe the HTTP endpoint instead - it is what the loaders and
      # browser use, and it answers in a second or two.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  auth-db-data:
  incident-db-data:
  asset-db-data:
  prometheus-data:
  grafana-data:
  neo4j-data:
